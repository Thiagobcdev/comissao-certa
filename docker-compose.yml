# Postgres local do Comissão Certa.
# Porta 5434 no host para não conflitar com outros Postgres na máquina (5432/5433).
services:
  db:
    image: postgres:16-alpine
    container_name: comissao_certa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: comissao
      POSTGRES_PASSWORD: comissao_dev
      POSTGRES_DB: comissao_certa
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - comissao_certa_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comissao -d comissao_certa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  comissao_certa_data:
